<div><br class="Apple-interchange-newline">name: Daily API batch<br><br>on:<br>  schedule:<br>    - cron: '0 0 * * *'  # 毎日 UTC 0:00 = JST 9:00<br>  workflow_dispatch:      # 手動実行も可能<br><br>jobs:<br>  fetch-and-commit:<br>    runs-on: ubuntu-latest<br><br>    steps:<br>      - name: Checkout repository<br>        uses: actions/checkout@v4<br><br>      - name: Set up Python<br>        uses: actions/setup-python@v5<br>        with:<br>          python-version: '3.12'<br><br>      - name: Install dependencies<br>        run: pip install requests<br><br>      - name: Run batch script<br>        env:<br>          API_KEY: ${{ secrets.API_KEY }}<br>        run: python batch.py<br><br>      - name: Commit results<br>        run: |<br>          git config user.name  "github-actions[bot]"<br>          git config user.email "github-actions[bot]@users.noreply.github.com"<br>          git add output/<br>          git diff --cached --quiet || git commit -m "chore: update batch output $(date +'%Y-%m-%d')"<br>          git push</div>
